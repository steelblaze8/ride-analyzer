<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ride Analyzer</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 560px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 32px; }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 28px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="file"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 20px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    small { color: #888; display: block; margin-top: -14px; margin-bottom: 18px; }
    button {
      background: #d64545;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #b93838; }
    .error {
      background: #fdecea;
      color: #a4292b;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🚴 Ride Analyzer</h1>
  <p class="subtitle">Upload a ride, get a coach-style breakdown.</p>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form action="/analyze" method="post" enctype="multipart/form-data">
      <label for="ride_file">Ride file (.fit or .gpx)</label>
      <input type="file" id="ride_file" name="ride_file" accept=".fit,.gpx" required>

      <label for="ftp">Your FTP (watts) — optional</label>
      <input type="number" id="ftp" name="ftp" placeholder="e.g. 250">
      <small>Only needed for power-based metrics (NP, IF, TSS). GPX files without a power meter won't use this.</small>

      <button type="submit">Analyze ride</button>
    </form>
  </div>
</body>
</html>
